# =============================================================================
# Security · Scan — IaC misconfig + committed-secret gate for the modules.
#
# The shared quynhonsemiconductor/ci security suite is app/container oriented (Semgrep
# TS/Node packs, Trivy image CVEs) and is the wrong tool for pure OpenTofu, so
# this repo runs the IaC-native pair instead (same shape as qnsc-infra):
#   • Checkov  — Terraform/OpenTofu misconfig scan over modules/. ENFORCED
#                against a baseline (fails CI on NEW misconfigurations only).
#   • Gitleaks — committed-secret scan.
#
# Lives in its own workflow (not ci.yml) so security is independently runnable
# and runs weekly — matching the org convention used by every other repo.
# =============================================================================
name: Security · Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly Monday 04:00 UTC — catch new rules/CVEs between pushes

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Replaces Code Scanning Default Setup's `Analyze (actions)` as the required
  # gate — that managed check doesn't reliably report on bot-authored PRs
  # (Dependabot/Renovate), leaving the required check stuck "Expected" forever.
  # Root cause: tf-modules#83.
  actions-security:
    permissions:
      contents: read
      security-events: write
    uses: quynhonsemiconductor/ci/.github/workflows/actions-security.yml@v1
    with:
      blocking: true

  checkov:
    # The job NAME is the required-check name on main (`checkov (IaC misconfig)`).
    # It must not change — which is why the scan below is a COMPOSITE action and
    # not a reusable workflow, whose check would report as `checkov / <inner>`.
    name: checkov (IaC misconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ENFORCED against a baseline: fails on NEW misconfigurations only. The
      # pre-existing findings are recorded in modules/.checkov.baseline (burn them
      # down over time; regenerate with --create-baseline).
      - uses: quynhonsemiconductor/ci/actions/iac-checkov@v1
        with:
          directory: modules/
          soft-fail: 'false'
          baseline: modules/.checkov.baseline

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/scan-secrets@v1
