# =============================================================================
# Release Commenter — thin caller of the shared reusable (ci). When a
# GitHub Release is published, back-comments on every PR merged since the last
# release and adds a "released: vX.Y.Z" label (semantic-release bot UX).
# =============================================================================
name: Release Commenter

on:
  release:
    types: [published]

jobs:
  comment:
    uses: quynhonsemiconductor/ci/.github/workflows/release-commenter.yml@ea2c56bd9b03fb4d52e8fb9fe98dca95fd278638 # v1.24.5
    permissions:
      contents: read
      pull-requests: write
      issues: write
