name: CI

on:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter here, deliberately — see `push` above, which keeps one.
    #
    # On `pull_request` this filter matches the PR's BASE branch, which is a different
    # question from `push`'s. Set to [main] it means "only run when this PR is aimed at
    # main", so a PR aimed anywhere else — a stacked PR, aimed at the branch below it —
    # got no CI at all, silently, while still reporting green. rova's eight-PR Phase 7
    # stack sat in exactly that state: seven of eight ran nothing but PR-title and labeler.
    #
    # `main` is this repo's only long-lived branch, so the filter skipped nothing anyone
    # wanted skipped. No upside, one silent failure mode.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # The job NAME is the required-check name on main. It must not change, which
    # is also why the gates below moved into a COMPOSITE action rather than a
    # reusable workflow: a reusable would report this as `validate / <inner job>`
    # and the required check `fmt · validate · tflint` would never report again.
    name: fmt · validate · tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Modules carry no backend, so validate resolves providers with
      # `init -backend=false` and needs no cloud credentials. infra cannot do
      # this — its validate needs a real backend and runs beside `tofu plan`.
      - uses: quynhonsemiconductor/ci/actions/iac-lint@v1
        with:
          tofu-version: '1.9.1'
          fmt: 'true'
          validate: 'true'
          tflint: 'true'
          dirs: 'modules/*/'
          tflint-version: v0.64.0
          # Raises tflint --init's ruleset download off the runner IP's shared
          # 60/hour anonymous limit. Without it the check is flaky by
          # construction — see the action's own input description.
          github-token: ${{ secrets.GITHUB_TOKEN }}
