name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TOFU_VERSION: '1.9.1'

jobs:
  validate:
    name: fmt · validate · tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: tofu fmt (check)
        run: tofu fmt -check -recursive

      # Validate each module independently. Modules have no backend, so
      # `tofu init -backend=false` is enough to resolve providers for validation.
      - name: tofu validate (per module)
        run: |
          set -euo pipefail
          for dir in modules/*/; do
            echo "── validating $dir ──"
            tofu -chdir="$dir" init -backend=false -input=false >/dev/null
            tofu -chdir="$dir" validate
          done

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: latest

      - name: tflint (per module)
        run: |
          set -euo pipefail
          tflint --init
          for dir in modules/*/; do
            echo "── tflint $dir ──"
            tflint --chdir="$dir"
          done
