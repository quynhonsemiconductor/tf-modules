# =============================================================================
# Release — thin caller of the shared reusable (ci). Runs release-please
# in MANIFEST / multi-component mode: each modules/<name> directory is versioned
# independently and tagged as `<name>-vX.Y.Z` (e.g. ecr-v1.1.0), matching how
# consumers pin `?ref=<name>-vX.Y.Z`. Before this, those tags were cut by hand.
#
# Requires: QNSC_AUTOMATION_APP_ID (org var) + QNSC_AUTOMATION_PRIVATE_KEY (org secret).
# Both optional — the reusable falls back to github.token when unset (but then
# release tags won't trigger downstream workflows).
# =============================================================================
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: quynhonsemiconductor/ci/.github/workflows/release-please.yml@v1
    with:
      manifest_file: .release-please-manifest.json
    secrets:
      QNSC_AUTOMATION_PRIVATE_KEY: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}